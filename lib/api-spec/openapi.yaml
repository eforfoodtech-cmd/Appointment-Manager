components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    RegisterRequest:
      oneOf:
        - $ref: "#/components/schemas/CustomerRegisterRequest"
        - $ref: "#/components/schemas/BarberRegisterRequest"
      discriminator:
        propertyName: role
        mapping:
          customer: "#/components/schemas/CustomerRegisterRequest"
          barber: "#/components/schemas/BarberRegisterRequest"

    CustomerRegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address; normalized to lowercase by the server.
          example: ayse@example.com
        password:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
        phone:
          $ref: "#/components/schemas/TurkishPhoneNumber"
        role:
          type: string
          enum: [customer]
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          deprecated: true
          description: Legacy full-name alias; use firstName and lastName.
        surname:
          type: string
          deprecated: true
          description: Legacy surname alias; use lastName.
      required:
        - email
        - password
        - phone
        - role
        - firstName
        - lastName

    BarberRegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address; normalized to lowercase by the server.
          example: salon@example.com
        password:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
        phone:
          $ref: "#/components/schemas/TurkishPhoneNumber"
        role:
          type: string
          enum: [barber]
        businessName:
          type: string
          minLength: 1
          maxLength: 160
        authorizedFirstName:
          type: string
          minLength: 1
          maxLength: 100
        authorizedLastName:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 500
        shopName:
          type: string
          deprecated: true
          description: Legacy business-name alias; use businessName.
        shopAddress:
          type: string
          deprecated: true
          description: Legacy address alias; use address.
        name:
          type: string
          deprecated: true
          description: Legacy authorized-person name alias.
        surname:
          type: string
          deprecated: true
          description: Legacy authorized-person surname alias.
      required:
        - email
        - password
        - phone
        - role
        - businessName
        - authorizedFirstName
        - authorizedLastName
        - address

    LoginRequest:
      oneOf:
        - $ref: "#/components/schemas/IdentifierLoginRequest"
        - $ref: "#/components/schemas/LegacyEmailLoginRequest"

    IdentifierLoginRequest:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            Email address or a canonical Turkish mobile number: exactly 10
            digits starting with 5, without a leading zero, country code, or
            formatting.
          example: "5551112233"
        password:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
      required:
        - identifier
        - password

    LegacyEmailLoginRequest:
      type: object
      deprecated: true
      additionalProperties: false
      description: Legacy email-based login body; use identifier instead.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          deprecated: true
          description: Legacy alias for identifier.
        password:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
      required:
        - email
        - password

    PasswordResetChannel:
      type: string
      enum: [email, phone]

    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            Email address or a canonical Turkish mobile number: exactly 10
            digits starting with 5, without a leading zero, country code, or
            formatting.
          example: "5551112233"
        channel:
          $ref: "#/components/schemas/PasswordResetChannel"
          description: >-
            Preferred delivery channel. If omitted, the server infers it from
            the identifier.
      required:
        - identifier

    PasswordResetRequestResponse:
      type: object
      properties:
        message:
          type: string
          description: Generic instructions that do not reveal account existence.
        resetId:
          type: string
          minLength: 1
          description: >-
            Opaque identifier for the verification attempt. Real and decoy IDs
            are indistinguishable.
      required:
        - message
        - resetId

    PasswordResetVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        resetId:
          type: string
          minLength: 1
          description: Opaque identifier returned by the reset request.
        code:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
          description: Six-digit, single-use verification code.
          example: "123456"
      required:
        - resetId
        - code

    PasswordResetVerifyResponse:
      type: object
      properties:
        message:
          type: string
        resetToken:
          type: string
          minLength: 1
          description: Opaque, short-lived, single-use password-reset token.
      required:
        - message
        - resetToken

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      properties:
        resetToken:
          type: string
          minLength: 1
          description: Opaque token returned after successful code verification.
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
      required:
        - resetToken
        - newPassword

    PasswordResetMessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    TurkishPhoneNumber:
      type: string
      pattern: '^5\d{9}$'
      minLength: 10
      maxLength: 10
      description: >-
        Canonical Turkish mobile number: exactly 10 digits starting with 5.
        Do not include a leading zero, country code, spaces, parentheses,
        hyphens, or other formatting.
      example: "5551112233"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [barber, customer]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    Barber:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        shopName:
          type: string
        shopAddress:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        isActive:
          type: boolean
        name:
          type: string
        email:
          type: string
      required:
        - id
        - userId
        - shopName
        - isActive
        - name
        - email

    UpdateBarberRequest:
      type: object
      properties:
        shopName:
          type: string
        shopAddress:
          type: string
        phone:
          $ref: "#/components/schemas/TurkishPhoneNumber"
        bio:
          type: string

    Availability:
      type: object
      properties:
        id:
          type: integer
        barberId:
          type: integer
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sunday, 1=Monday, ..., 6=Saturday
        startTime:
          type: string
          description: HH:MM format
        endTime:
          type: string
          description: HH:MM format
        isOpen:
          type: boolean
          description: Whether this day is open for appointments
        slotDuration:
          type: integer
          description: Slot length in minutes (e.g. 30, 45, 60)
      required:
        - id
        - barberId
        - dayOfWeek
        - startTime
        - endTime
        - isOpen
        - slotDuration

    AvailabilityInput:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        startTime:
          type: string
        endTime:
          type: string
        isOpen:
          type: boolean
        slotDuration:
          type: integer
          description: Slot length in minutes
      required:
        - dayOfWeek
        - startTime
        - endTime
        - isOpen
        - slotDuration

    SlotAppointmentDetail:
      type: object
      properties:
        id:
          type: integer
        notes:
          type: string
          nullable: true
        status:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
        isManual:
          type: boolean
          description: True if appointment was added manually by barber (no app customer)
      required:
        - id
        - status
        - customerName
        - isManual

    AppointmentSlot:
      type: object
      properties:
        id:
          type: integer
        barberId:
          type: integer
        date:
          type: string
          format: date
        startTime:
          type: string
          description: HH:MM format
        endTime:
          type: string
          description: HH:MM format
        isAvailable:
          type: boolean
        isBooked:
          type: boolean
        appointment:
          $ref: "#/components/schemas/SlotAppointmentDetail"
          nullable: true
      required:
        - id
        - barberId
        - date
        - startTime
        - endTime
        - isAvailable
        - isBooked

    CreateSlotRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        isAvailable:
          type: boolean
      required:
        - date
        - startTime
        - endTime

    UpdateSlotRequest:
      type: object
      properties:
        isAvailable:
          type: boolean

    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled, completed, no_show]

    Appointment:
      type: object
      properties:
        serviceName:
          type: string
          nullable: true
        priceKurus:
          type: integer
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        id:
          type: integer
        slotId:
          type: integer
        barberId:
          type: integer
        customerId:
          type: integer
          nullable: true
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        notes:
          type: string
          nullable: true
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        barberName:
          type: string
        shopName:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
        isManual:
          type: boolean
          description: True if appointment was added manually by barber (no app customer)
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slotId
        - barberId
        - status
        - date
        - startTime
        - endTime
        - barberName
        - shopName
        - customerName
        - isManual
        - createdAt

    CreateAppointmentRequest:
      type: object
      properties:
        serviceId:
          type: integer
        slotId:
          type: integer
        notes:
          type: string
        customerId:
          type: integer
          description: Optional — barber can specify a customer when booking manually
        manualCustomerName:
          type: string
          description: Barber-only — create a manual appointment with just a name (no app customer)
      required:
        - slotId

    UpdateAppointmentRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        slotId:
          type: integer
          description: New slot ID for rescheduling
        notes:
          type: string

    NoShowBlock:
      type: object
      properties:
        id:
          type: integer
        barberId:
          type: integer
        customerId:
          type: integer
        reason:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        customerName:
          type: string
        customerPhone:
          type: string
          nullable: true
      required:
        - id
        - barberId
        - customerId
        - createdAt
        - customerName

    CreateBlockRequest:
      type: object
      properties:
        customerId:
          type: integer
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry. Omit for permanent block.
      required:
        - customerId

    Message:
      type: object
      properties:
        id:
          type: integer
        senderId:
          type: integer
        receiverId:
          type: integer
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        senderName:
          type: string
        receiverName:
          type: string
      required:
        - id
        - senderId
        - receiverId
        - content
        - isRead
        - createdAt
        - senderName
        - receiverName

    SendMessageRequest:
      type: object
      properties:
        receiverIds:
          type: array
          items:
            type: integer
          description: One or multiple customer IDs
        content:
          type: string
      required:
        - receiverIds
        - content

    PushToken:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        token:
          type: string
        platform:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - token
        - createdAt
        - updatedAt
        - lastSeenAt

    PushTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        platform:
          type: string
      required:
        - token

    BarberDashboard:
      type: object
      properties:
        todayCount:
          type: integer
        pendingCount:
          type: integer
        completedCount:
          type: integer
        noShowCount:
          type: integer
        todayAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        nextAppointment:
          $ref: "#/components/schemas/Appointment"
          nullable: true
      required:
        - todayCount
        - pendingCount
        - completedCount
        - noShowCount
        - todayAppointments
